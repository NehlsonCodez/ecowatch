<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoWatch — Smart Home Electricity Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======================= AUTH SCREEN ======================= -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-backdrop" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">⚡</span>
      <span class="brand-name">EcoWatch</span>
    </div>
    <p class="auth-tagline">Know exactly where your power goes.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="register">Create account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required placeholder="admin">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <div class="auth-error" id="login-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
      <p class="auth-hint">Demo accounts — admin / admin123 &nbsp;·&nbsp; homeowner / home123</p>
    </form>

    <form id="register-form" class="auth-form" hidden>
      <label class="field">
        <span>Full name</span>
        <input type="text" name="full_name" required placeholder="Jane Homeowner">
      </label>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" required placeholder="choose a username">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required minlength="4" placeholder="at least 4 characters">
      </label>
      <label class="field">
        <span>Account type</span>
        <select name="role">
          <option value="homeowner">Homeowner</option>
          <option value="admin">Admin</option>
        </select>
      </label>
      <div class="auth-error" id="register-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</div>

<!-- ======================= APP SHELL ======================= -->
<div id="app-shell" class="app-shell" hidden>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">⚡</span>
      <span class="brand-name">EcoWatch</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 12L12 3l9 9M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="rooms">
        <svg viewBox="0 0 24 24" class="nav-icon"><rect x="3" y="4" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="8" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="14" width="8" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Rooms</span>
      </button>
      <button class="nav-item" data-view="devices">
        <svg viewBox="0 0 24 24" class="nav-icon"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Devices</span>
      </button>
      <button class="nav-item" data-view="reports">
        <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Reports</span>
      </button>
      <button class="nav-item" data-view="alerts">
        <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 3l9 16H3L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Alerts</span>
        <span class="nav-badge" id="alerts-nav-badge" hidden>0</span>
      </button>
      <button class="nav-item" data-view="admin" id="nav-admin" hidden>
        <svg viewBox="0 0 24 24" class="nav-icon"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Admin</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">JH</div>
        <div class="user-meta">
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <p class="page-subtitle" id="page-subtitle">Live view of your home's electricity use</p>
      </div>
      <div class="topbar-right">
        <div class="live-pill">
          <span class="live-dot"></span>
          <span id="live-power-value">0 W</span>
        </div>
      </div>
    </header>

    <div class="view-container" id="view-container">
      <!-- Views are rendered here by app.js -->
    </div>
  </main>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<!-- Generic modal -->
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" id="modal"></div>
</div>

<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
